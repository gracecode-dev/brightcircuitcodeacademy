<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #000;
            opacity: 0.9;
            overflow: hidden;
            scroll-behavior: smooth;


        }

        .background{
            position: relative;
            width: 100%;
            height: 100%;
            /* object-fit: cover; */

            
        }

        .signin{
            position: absolute;
            width: 300px;
            height: auto;
            background-color:#000;
            opacity: 0.95;
           top:50%;
           left:50%;
           transform: translate(-50%,-50%);
           padding: 40px;
           z-index: 2;
        }

        h2{
            position: relative;
            width: 100%;
            height: auto;
            margin-bottom: 20px;
            text-transform: capitalize;
            color: #fff;
        }
        
        .text{
            position: relative;
            width: 100%;
            height: 40px;
            margin-bottom: 20px;
            padding: 0 10px;
            border-radius: 2px;
            border: none;
            background-color: #333;
            color: #fff;
            font-size: 12px;
        }

        button{
            position: relative;
            width: 100%;
            height: 40px;
            border-radius: 2px;
            border: none;
            background-color: #e50914;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }

        .remember{
            position: relative;
            width: 100%;
            height: auto;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #fff;
            margin-bottom: 50px;
        }

        .google{
            position: relative;
            width: 100%;
            height: auto;
            margin-top: 20px;
            font-size: 12px;
            color: #fff;
            font-size: 14px;

        }
        .sign{
            position: relative;
            width: 100%;
            height: auto;
            margin-top: 20px;
            font-size: 14px;
            color: #fff;
            display: flex;
            /* justify-content: space/-between; */
        }
        a{
            text-decoration: none;
            color: #fff;
        }
        a:hover{
            text-decoration: underline;
        }

        /* media */

        @media screen and (max-width: 768px){
            .container{
                /* height: 100%; */
            }
            .background{
                height: 100%;
                object-fit: cover;
            }
            .signin{
                width: 90%;
                padding: 20px;
                border-radius: 7px;
            }
        }

    </style>

</head>
<body>
    <div class="container">
        <img class="background" src="https://i.pinimg.com/736x/70/43/8d/70438dc6bc30d9fbd80af98f4034141e.jpg" alt="">

        <div class="logo">
            <img src="" alt="">
        </div>

       <div class="signin">
          <h2>Sign in</h2>
        <form>
            <input class="text" type="text" placeholder="Username">
            <input class="text" type="password" placeholder="Password">
            <button type="submit">Login</button>

            <div class="remember">
               <span>
                <input type="checkbox" name="" id="">
                <label for="">Remember me</label>
               </span>

                <span class="help">Need help?</span>
            </div>

            <span class="google">
               login with <a href="#">Google</a> or <a href="#">Facebook</a>
            </span>

            <span class="sign">
                new to netflix? <a href="#">  Sign up</a>
            </span>

        </form>
       </div>
    </div>
</body>
</html>
